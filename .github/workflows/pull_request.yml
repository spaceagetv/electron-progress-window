name: CI

on:
  pull_request:
    branches:
      - main
  # Also run on push to main so the CI badge in the README reflects the
  # actual test status of the main branch
  push:
    branches:
      - main

# Repo default may be broader than this; pin CI down to read-only and let
# individual jobs widen only if they ever need to (none currently do).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    # Electron's ~100MB binary comes from the release CDN once per job, and
    # a refused connection there fails the job outright — #93 lost runs to
    # both `socket hang up` and a 503.
    #
    # electron_config_cache, not ELECTRON_CACHE: electron/install.js reads
    # `process.env.electron_config_cache` and passes it to @electron/get as
    # cacheRoot. ELECTRON_CACHE belongs to electron-builder and this
    # installer ignores it — set that one and the binary quietly lands in
    # ~/.cache/electron, leaving actions/cache nothing to save.
    #
    # github.workspace rather than the tidier runner.temp because the runner
    # context is not available in job-level env; it would expand to an empty
    # string. The cache is restored after checkout, so the workspace clean
    # step cannot wipe it.
    env:
      electron_config_cache: ${{ github.workspace }}/.electron-cache

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/playground/package-lock.json
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.electron-cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'examples/playground/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - name: Install dependencies
        run: npm ci
      - name: Prefetch Electron binary
        # `npm ci` does not fetch the ~100MB Electron binary — electron's
        # index.js downloads it lazily on the first `require('electron')`,
        # which lands in the middle of the test run. That is a single
        # un-retried GET against the GitHub release CDN, and it is the most
        # fragile thing in this job: #93 lost runs to both `socket hang up`
        # and `503 Service Unavailable` there.
        #
        # Pulling it here retries the transient failures and populates
        # electron_config_cache, so actions/cache has something to save and later
        # runs skip the download entirely. bash so the loop works on Windows.
        shell: bash
        run: |
          # Escalating backoff: the failures seen on #93 were the CDN
          # refusing the connection outright (`fetch failed` in ~150ms, and
          # a 503 on Windows), not slow transfers. Retrying tightly just
          # re-hits the same throttle, so back off further each time.
          for delay in 15 30 60 0; do
            if node -e "require('electron')"; then exit 0; fi
            if [ "$delay" -eq 0 ]; then break; fi
            echo "Electron download failed; retrying in ${delay}s."
            sleep "$delay"
          done
          echo "Electron binary could not be downloaded after 4 attempts."
          exit 1
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Audit dependencies
        # Audits the whole tree and prints every finding; --audit-level only
        # controls the exit code. `critical` is the threshold that is actually
        # actionable today: the dev toolchain (api-extractor/api-documenter,
        # electron-mocks) carries known high/moderate advisories that npm can
        # only "fix" by downgrading to older majors, so gating at `high` would
        # fail every run from day one and get muted. Raise this the moment
        # those clear.
        #
        # Deliberately not `--omit=dev`: this package has zero runtime
        # dependencies, so that variant audits an empty tree and can never
        # fail, which reads like coverage without being any.
        run: npm audit --audit-level=critical

  e2e:
    strategy:
      # One job's flaky Electron download used to cancel the other two, so a
      # run reported a single failure and nothing about the platforms that
      # would have passed. Let every OS report its own result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One Node version on purpose. Electron ships its own Node runtime,
        # so a second entry here only varies the host Node that launches
        # Playwright — it does not test the library under a different
        # runtime. The build job already covers 22.x and 24.x for the unit
        # tests and lint, where the host Node is what actually runs the code.
        # Doubling this matrix doubles the Electron downloads for no coverage.
        node-version: [22.x]
        bundled: [false]
        # One extra combination, not a fourth dimension: it rebuilds the
        # playground's main process with esbuild, inlining this library the
        # way a consuming app packed with webpack/vite/forge would. That is
        # the scenario examples/progress-window-typescript-webpack used to
        # stand in for by hand, without ever being built by CI.
        #
        # `bundled` differs from the [false] above, so GitHub adds this as a
        # new job rather than merging it into the existing ubuntu one. Ubuntu
        # alone is enough: bundling is a build-time transform of JS, so a
        # break in it is platform-independent, unlike the Electron and window
        # behaviour the other three jobs exist to cover.
        include:
          - os: ubuntu-latest
            node-version: 22.x
            bundled: true

    runs-on: ${{ matrix.os }}

    # Without this, every matrix value lands in the job name and the
    # unbundled jobs read "e2e (ubuntu-latest, 22.x, false)".
    name: e2e (${{ matrix.os }}${{ matrix.bundled && ', bundled' || '' }})

    # See the build job for why this is electron_config_cache and not
    # ELECTRON_CACHE. It matters more here: this job installs Electron twice,
    # once for the repo and once for examples/playground via global-setup.ts.
    # Both resolve to the same version now, so the second one is a cache hit
    # rather than a second trip to the CDN.
    env:
      electron_config_cache: ${{ github.workspace }}/.electron-cache
      # global-setup.ts checks for exactly "1"; matrix.bundled is a boolean,
      # so it has to be mapped rather than passed through as "true"/"false".
      EPW_BUNDLED: ${{ matrix.bundled && '1' || '' }}

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/playground/package-lock.json
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.electron-cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'examples/playground/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - name: Install dependencies
        run: npm ci
      - name: Prefetch Electron binary
        # `npm ci` does not fetch the ~100MB Electron binary — electron's
        # index.js downloads it lazily on the first `require('electron')`,
        # which lands in the middle of the test run. That is a single
        # un-retried GET against the GitHub release CDN, and it is the most
        # fragile thing in this job: #93 lost runs to both `socket hang up`
        # and `503 Service Unavailable` there.
        #
        # Pulling it here retries the transient failures and populates
        # electron_config_cache, so actions/cache has something to save and later
        # runs skip the download entirely. bash so the loop works on Windows.
        shell: bash
        run: |
          # Escalating backoff: the failures seen on #93 were the CDN
          # refusing the connection outright (`fetch failed` in ~150ms, and
          # a 503 on Windows), not slow transfers. Retrying tightly just
          # re-hits the same throttle, so back off further each time.
          for delay in 15 30 60 0; do
            if node -e "require('electron')"; then exit 0; fi
            if [ "$delay" -eq 0 ]; then break; fi
            echo "Electron download failed; retrying in ${delay}s."
            sleep "$delay"
          done
          echo "Electron binary could not be downloaded after 4 attempts."
          exit 1
      - name: Install Playwright system dependencies (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install-deps
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:e2e
      - name: Run E2E tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # upload-artifact@v4 rejects a duplicate name outright, and the
          # bundled job runs on ubuntu like one of the others, so the OS is
          # no longer unique on its own.
          name: playwright-report-${{ matrix.os }}${{ matrix.bundled && '-bundled' || '' }}
          path: playwright-report/
          retention-days: 30

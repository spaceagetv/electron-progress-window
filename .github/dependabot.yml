version: 2
updates:
  # Library itself — zero runtime deps, but dev tooling still needs patching.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # majors are left ungrouped so they each get their own PR for review

  # examples/playground is built and driven by the E2E suite in
  # pull_request.yml (see test/e2e/global-setup.ts), so its deps
  # (notably electron) are exercised by CI and worth keeping current.
  - package-ecosystem: "npm"
    directory: "/examples/playground"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # examples/progress-window-typescript-webpack is not built or run by
  # any workflow — it's a static reference snippet. Deliberately excluded:
  # Dependabot PRs against it would be unverified noise (nothing in CI
  # would catch a breakage) rather than a useful signal.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

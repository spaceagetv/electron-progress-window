version: 2
updates:
  # Library itself — zero runtime deps, but dev tooling still needs patching.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # majors are left ungrouped so they each get their own PR for review

  # examples/playground is built and driven by the E2E suite in
  # pull_request.yml (see test/e2e/global-setup.ts), so its deps
  # (notably electron) are exercised by CI and worth keeping current.
  - package-ecosystem: "npm"
    directory: "/examples/playground"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # examples/playground is the only example. examples/progress-window-typescript-webpack
  # used to live here too, as a hand-checked demonstration that this library
  # survives being bundled — but nothing built or ran it, so it only ever
  # produced unverified Dependabot noise. That property is now covered for
  # real: post-build.js fails the build if any asset is still read off disk
  # relative to __dirname, and the `bundled: true` E2E job in
  # pull_request.yml runs the whole suite against an esbuild-bundled
  # playground.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
